[project]
name = "pydantic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mike Polinowski", email = "mpolinowski@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.151.0",
    "fastmcp>=4.1.1",
    "huggingface-hub>=2.2.0",
    "nest-asyncio>=1.6.0",
    "openai>=3.35.1",
    "pydantic-ai-slim[openai]>=2.58.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "python-weather>=2.2.7",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
pydantic-ai = "pydantic_ai:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
